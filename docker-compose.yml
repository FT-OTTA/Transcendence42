  # kibana:
  #   image: kibana:8.11.0
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     - elasticsearch

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - nodejs
      - front
    networks:
      - otta
    restart: unless-stopped
  
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx:9113/metrics
    networks:
      - otta
    depends_on:
      - nginx
    restart: unless-stopped

  nodejs:
    build: ./nodejs
    container_name: nodejs
    env_file:
      - ./.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - otta
    restart: unless-stopped

  mysql:
    build: ./mysql
    container_name: mysql
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - ./.env
    networks:
      - otta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter
    command:
      - "--mysqld.username=root:${MYSQL_ROOT_PASSWORD}"
      - "--mysqld.address=mysql:3306"
    networks:
      - otta
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: front
    volumes:
      - ./front:/app/front
      - /app/front/node_modules
      - /app/front/.next
    command: npm run dev -- -H 0.0.0.0
    env_file:
      - ./.env
    networks:
      - otta
    restart: unless-stopped

volumes:
  db_data:
    name: db_data
  grafana_data:
  prometheus_data:

networks:
  otta:
    driver: bridge
