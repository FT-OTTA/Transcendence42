services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - nodejs
      - front
    networks:
      - otta
    restart: unless-stopped

  nodejs:
    image: node:lts-alpine
    container_name: nodejs
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npx prisma db push && npx tsx watch src/server.ts"
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - otta
    restart: unless-stopped
    volumes:
      - ./nodejs:/app
      - nodejs_node_modules:/app/node_modules

  front:
    image: node:lts-alpine
    container_name: front
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    env_file:
      - ./.env
    ports:
      - "3001:3001"
    networks:
      - otta
    restart: unless-stopped
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules

  mysql:
    build: ./mysql
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - ./.env
    networks:
      - otta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    name: db_data
  nodejs_node_modules:
    name: nodejs_node_modules
  front_node_modules:
    name: front_node_modules

networks:
  otta:
    driver: bridge