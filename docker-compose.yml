services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - otta
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - otta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/5044"]
      interval: 5s
      timeout: 5s
      retries: 10
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://transcendence42-elasticsearch-1:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - otta
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - nodejs
    networks:
      - otta
    restart: unless-stopped
    labels:
      collect_logs: "true"

  nodejs:
    build: ./nodejs
    container_name: nodejs
    env_file:
      - ./.env
    depends_on:
        mysql:
            condition: service_healthy
        logstash:
            condition: service_healthy
    networks:
      - otta
    restart: unless-stopped
    labels:
      collect_logs: "true"
  mysql:
    build: ./mysql
    container_name: mysql
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - ./.env
    networks:
      - otta
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 5s
        timeout: 5s
        retries: 10
    labels:
      collect_logs: "true"
  front:
    build: ./front
    container_name: front
    env_file:
      - ./.env
    ports:
      - "3001:3001"
    networks:
      - otta
    restart: unless-stopped
    labels:
      collect_logs: "true"

volumes:
  db_data:
    name: db_data
  elastic_data:
    name: elastic_data

networks:
  otta:
    driver: bridge
