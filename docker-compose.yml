services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    env_file:
      - ./.env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - otta
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    env_file:
      - ./.env
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - otta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/5044"]
      interval: 5s
      timeout: 5s
      retries: 10
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    env_file:
      - ./.env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICE_TOKEN}
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
    depends_on:
      - elasticsearch
    networks:
      - otta
    restart: unless-stopped

  # kibana-setup:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   depends_on:
  #     - elasticsearch
  #   networks:
  #     - otta
  #   restart: "no"
  #   entrypoint: ["bash", "-c", "sleep 10 && curl -s -X POST -u elastic:$$ELASTIC_PASSWORD http://elasticsearch:9200/_security/service/elastic/kibana/credential/token/kibana_token"]
  #   env_file:
  #     - ./.env
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - nodejs
    networks:
      - otta
    restart: unless-stopped
    labels:
      collect_logs: "true"

  nodejs:
    build: ./nodejs
    container_name: nodejs
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
        mysql:
            condition: service_healthy
        logstash:
            condition: service_healthy
    networks:
      - otta
    restart: unless-stopped
    volumes: # only for dev purpose gotta remove later
      - ./nodejs/src:/app/src
      - ./nodejs/databases:/app/databases
      - /app/node_modules
    labels:
      collect_logs: "true"
      
  mysql:
    build: ./mysql
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - ./.env
    networks:
      - otta
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 5s
        timeout: 5s
        retries: 10
    labels:
      collect_logs: "true"
  front:
    build: ./front
    container_name: front
    env_file:
      - ./.env
    ports:
      - "3001:3001"
    networks:
      - otta
    restart: unless-stopped
    labels:
      collect_logs: "true"
    volumes:
      - ./front:/app
      - /app/node_modules

volumes:
  db_data:
    name: db_data
  elastic_data:
    name: elastic_data

networks:
  otta:
    driver: bridge
