  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - nodejs
    networks:
      - otta
    restart: unless-stopped

  nodejs:
    build: ./nodejs
    container_name: nodejs
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
        mysql:
            condition: service_healthy
    networks:
      - otta
    restart: unless-stopped

  mysql:
    build: ./mysql
    container_name: mysql
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - ./.env
    networks:
      - otta
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 5s
        timeout: 5s
        retries: 10
  front:
    build: ./front
    container_name: front
    env_file:
      - ./.env
    ports:
      - "3001:3001"
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - otta
    restart: unless-stopped

volumes:
  db_data:
    name: db_data

networks:
  otta:
    driver: bridge
